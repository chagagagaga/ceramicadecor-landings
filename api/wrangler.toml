name = "cd-lead"
main = "worker.js"
compatibility_date = "2026-09-01"

# ВАЖНО: секретов здесь нет и быть не должно. Этот файл лежит в публичном
# репозитории, и всё, что в него попадёт, попадёт и в открытый доступ.
# Токены заводятся командой `wrangler secret put ИМЯ` — они хранятся
# на стороне Cloudflare, в код и в браузер не попадают.
#
# Список секретов:
#   TG_TOKEN_LUCH    — токен бота «Первый Луч» от @BotFather
#   TG_CHAT_LUCH     — id группы, куда шлём заявки Первого Луча
#   TG_TOKEN_CD      — токен бота посадочных Керамики
#   TG_CHAT_CD       — id группы, куда шлём заявки Керамики
#   LSO_ENDPOINT     — адрес приёма заявок в ЛСО
#   SHEET_ID         — id Google-таблицы с дублями заявок
#   GOOGLE_SA_EMAIL  — почта сервисного аккаунта Google
#   GOOGLE_SA_KEY    — приватный ключ сервисного аккаунта (PEM целиком)
#   RESEND_API_KEY   — ключ Resend для дубля на почту (необязательно)
#   MAIL_TO          — куда слать дубль на почту (через запятую)
#   MAIL_FROM        — от кого, например: Заявки <info@1-luch.ru>

[vars]
# Публичные переменные: они видны в панели Cloudflare и это нормально.
# Список источников, которым разрешено слать заявки. Звёздочку не ставим:
# иначе форму можно было бы дёргать с любой страницы в интернете.
ALLOWED_ORIGINS = "https://chagagagaga.github.io,http://localhost:8099,http://127.0.0.1:8099"
