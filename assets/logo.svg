<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Ceramica Decor">
  <!-- Фирменный знак Ceramica Decor: дерево в квадратной рамке.
       Перерисован в вектор с логотипа основного сайта — растровый
       335×78 мылил на ретине и не умел быть белым на тёмном фоне.
       currentColor: цвет задаёт CSS, знак работает и на светлом, и на тёмном. -->
  <rect x="4" y="4" width="92" height="92" rx="4" fill="none" stroke="currentColor" stroke-width="8"/>
  <g fill="currentColor">
    <!-- ствол с изгибом и ветвью вправо -->
    <path d="M50.5 88c-3.2-13.5-3.4-25.6-1.1-35.6 2-8.6 5.6-15.4 10.3-20.4a2.6 2.6 0 0 1 3.8 3.5c-4.2 4.5-7.5 10.7-9.3 18.6-.6 2.6-1 5.4-1.3 8.3 2.6-1.1 5-2.7 7.2-4.9 2.3-2.2 4.3-5 6-8.2a2.6 2.6 0 1 1 4.6 2.4c-1.9 3.6-4.2 6.7-6.8 9.2-3 2.9-6.4 4.9-10.1 6.1-.2 6.9.4 14.4 2 22.5z"/>
    <!-- листья: верхняя пара -->
    <ellipse cx="41.5" cy="26.5" rx="7" ry="11.5" transform="rotate(-18 41.5 26.5)"/>
    <ellipse cx="63"   cy="24"   rx="7" ry="11.5" transform="rotate(24 63 24)"/>
    <!-- средняя пара -->
    <ellipse cx="24"   cy="45"   rx="11.5" ry="7" transform="rotate(-14 24 45)"/>
    <ellipse cx="77"   cy="43"   rx="11.5" ry="7" transform="rotate(14 77 43)"/>
    <!-- нижняя пара -->
    <ellipse cx="28"   cy="66"   rx="11.5" ry="7" transform="rotate(-24 28 66)"/>
    <ellipse cx="74"   cy="64"   rx="11.5" ry="7" transform="rotate(22 74 64)"/>
  </g>
</svg>
