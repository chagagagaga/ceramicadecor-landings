<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="MAX">
  <!-- Фирменный знак мессенджера MAX: белый пузырь-кольцо на градиенте
       от голубого к фиолетовому. Внешний контур снят с официального
       favicon.svg с max.ru — нарисованный на глаз знак люди не опознают,
       а MAX сейчас основной канал связи в России. -->
  <defs>
    <linearGradient id="maxg" x1="4" y1="96" x2="96" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23C4F0"/>
      <stop offset=".45" stop-color="#4B5BFF"/>
      <stop offset="1" stop-color="#B22BE8"/>
    </linearGradient>
    <mask id="maxm">
      <rect width="100" height="100" fill="#000"/>
      <g transform="translate(11.5 11.5) scale(0.77)">
        <path fill="#fff" d="M50.7571 0.261719C78.2929 0.261719 99.8857 22.5974 99.8857 50.1474C99.8857 77.6974 77.6071 99.4903 51.0214 99.4903C41.5857 99.4903 37.0143 98.1617 29.65 92.9474C29.1429 92.5903 28.45 92.6831 28.0214 93.1403C22.3571 99.1831 7.85 103.426 7.18571 95.176C7.18571 80.7903 0 71.4474 0 49.876C0 21.5546 23.2214 0.261719 50.7571 0.261719Z"/>
      </g>
      <!-- вырез: пузырь читается кольцом, как в оригинале -->
      <circle cx="53" cy="47" r="17.5" fill="#000"/>
    </mask>
  </defs>
  <rect width="100" height="100" rx="23" fill="url(#maxg)"/>
  <rect width="100" height="100" rx="23" fill="#fff" mask="url(#maxm)"/>
</svg>
